name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.4.0"

jobs:
  quality:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: ${{ env.PYTHON_VERSION }} }
      - name: Install uv
        run: pip install uv==${{ env.UV_VERSION }}
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Lint with ruff
        run: uv run ruff check . --output-format=github
      - name: Format check
        run: uv run ruff format . --check
      - name: Type check
        run: uv run mypy src/ production_pipeline/ --ignore-missing-imports

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix: { python-version: ["3.10", "3.11"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: ${{ matrix.python-version }} }
      - name: Install uv
        run: pip install uv==${{ env.UV_VERSION }}
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest tests/ -v --cov=src/rag_pipeline
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with: { file: ./coverage.xml, fail_ci_if_error: false }

  dry-run-pipeline:
    name: Dry-Run Pipeline
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: ${{ env.PYTHON_VERSION }} }
      - name: Install uv
        run: pip install uv==${{ env.UV_VERSION }}
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Dry-run EDA stage
        run: just run stage=eda args="--dry-run"
        continue-on-error: true  # Expected to fail if no data
